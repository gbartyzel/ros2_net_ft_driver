name: Build Rolling

on:
  push:
    branches:
      - main
      - rolling
  pull_request:
    branches:
      - main
      - rolling

env:
  ROS_REPO: main
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  BASEDIR: ${{ github.workspace }}/.work
  CACHE_PREFIX: rolling-main
  BEFORE_INSTALL_TARGET_DEPENDENCIES: |
    sudo apt-get -qq update && 
    sudo apt-get install -y pkg-config libasio-dev libcurlpp-dev libcurl4-openssl-dev

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Checkout source code from the repository
      - uses: actions/checkout@v4
        with:
          ref: rolling

      # Cache target_ws to speed up build
      - name: Cache target_ws
        uses: actions/cache@v4
        with:
          path: ${{ env.BASEDIR }}/target_ws
          key: target_ws-${{ env.CACHE_PREFIX }}-${{ hashFiles('**/CMakeLists.txt', '**/package.xml') }}-${{ github.run_id }}
          restore-keys: |
            target_ws-${{ env.CACHE_PREFIX }}-${{ hashFiles('**/CMakeLists.txt', '**/package.xml') }}

      # Cache ccache to speed up compilation
      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ env.CACHE_PREFIX }}-${{ github.sha }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ env.CACHE_PREFIX }}-${{ github.sha }}
            ccache-${{ env.CACHE_PREFIX }}

      # Run the ROS industrial CI, which will take care of building
      - uses: "ros-industrial/industrial_ci@master"
        env: ${{ matrix.env }}

      # Upload test results if the build fails
      - name: Upload test artifacts (on failure)
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results
          path: ${{ env.BASEDIR }}/target_ws/**/test_results/**/*.xml

      # Clean up before caching the next run
      - name: Prepare target_ws for caching
        if: ${{ always() }}
        run: |
          du -sh ${{ env.BASEDIR }}/target_ws
          sudo find ${{ env.BASEDIR }}/target_ws -wholename '*/test_results/*' -delete
          sudo rm -rf ${{ env.BASEDIR }}/target_ws/src
          du -sh ${{ env.BASEDIR }}/target_ws
